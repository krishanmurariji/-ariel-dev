{% load i18n %}
{% include "onboarding/stepper/_nav.html" %}
{% include "onboarding/stepper/_messages.html" %}
<div class="oh-step">
  <div class="oh-step__header oh-step__header--with-action">
    <div class="d-flex gap-2 align-items-start">
      <ion-icon name="document-attach-outline" class="oh-step__icon"></ion-icon>
      <h4 class="m-0">{% trans "Document Verification" %}</h4>
    </div>
    <button type="button" class="oh-btn oh-btn--secondary oh-btn--sm"
      hx-get="{% url 'onboarding-stepper-document-request' candidate.pk %}"
      hx-target="#genericModalBody"
      data-toggle="oh-modal-toggle"
      data-target="#genericModal">
      <ion-icon name="add-circle-outline"></ion-icon> {% trans "Request Document" %}
    </button>
  </div>

  <div class="oh-step__body">
    {% include "onboarding/stepper/_document_list.html" %}
  </div>

  <div class="oh-step__footer">
    <button type="button" class="oh-btn oh-btn--light"
      hx-get="{% url 'onboarding-stepper-step' candidate.pk back_key %}"
      hx-target="#stepperContent" hx-swap="innerHTML">
      <ion-icon name="arrow-back-outline"></ion-icon> {% trans "Back" %}
    </button>
    <button type="button" class="oh-btn oh-btn--secondary"
      hx-get="{% url 'onboarding-stepper-step' candidate.pk next_key %}"
      hx-target="#stepperContent" hx-swap="innerHTML">
      {% trans "Next" %} <ion-icon name="arrow-forward-outline"></ion-icon>
    </button>
  </div>
</div>
