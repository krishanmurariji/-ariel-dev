{% extends "index.html" %}
{% load i18n %}
{% block content %}
<div class="oh-stepper-page">
  <div class="oh-stepper-page__nav" id="stepperNav">
    {% include "onboarding/stepper/_nav.html" %}
  </div>
  <div class="oh-stepper-page__content" id="stepperContent"
    hx-get="{% url 'onboarding-stepper-step' candidate.pk landing_key %}"
    hx-trigger="load"
    hx-swap="innerHTML">
    <div class="oh-stepper-page__loading">
      <div class="oh-spinner"></div>
    </div>
  </div>
</div>

<style>
  .oh-stepper-page {
    display: flex;
    gap: 0;
    height: calc(100vh - 120px);
    border: 1px solid var(--oh-border-color, #e4e6ef);
    border-radius: 12px;
    overflow: hidden;
    background: var(--oh-body-bg, #fff);
  }
  .oh-stepper-page__nav {
    width: 20%;
    min-width: 240px;
    border-right: 1px solid var(--oh-border-color, #e4e6ef);
    background: var(--oh-sidebar-bg, #f7f8fa);
    overflow-y: auto;
  }
  .oh-stepper-page__content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 28px 32px 0;
  }
  .oh-stepper-page__loading { display: flex; justify-content: center; padding: 60px; }
  .oh-spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid #e4e6ef; border-top-color: #2f6f63;
    animation: oh-spin 0.8s linear infinite;
  }
  @keyframes oh-spin { to { transform: rotate(360deg); } }

  .oh-stepper-nav__header {
    display: flex; align-items: center; gap: 10px;
    padding: 20px 18px;
    border-bottom: 1px solid var(--oh-border-color, #e4e6ef);
  }
  .oh-stepper-nav__header ion-icon { font-size: 20px; color: #2f6f63; flex: none; }
  .oh-stepper-nav__header .title {
    font-weight: 600; font-size: 0.92rem; letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--oh-text-muted, #666);
  }
  .oh-stepper-nav__list { list-style: none; margin: 0; padding: 18px 16px 22px; }
  .oh-stepper-nav__li { display: flex; gap: 12px; }
  .oh-stepper-nav__rail { display: flex; flex-direction: column; align-items: center; flex: none; }
  .oh-stepper-nav__line {
    width: 2px; flex: 1; min-height: 22px;
    background: var(--oh-border-color, #e4e6ef);
    margin: 4px 0;
  }
  .oh-stepper-nav__li.is-done .oh-stepper-nav__line { background: #2f6f63; }
  .oh-stepper-nav__num {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    background: #eceef2; color: #666; border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700;
  }
  .oh-stepper-nav__num ion-icon { font-size: 14px; }
  .oh-stepper-nav__li.is-done .oh-stepper-nav__num { background: #2f6f63; color: #fff; }
  .oh-stepper-nav__li.is-active .oh-stepper-nav__num {
    background: #fff; color: #2f6f63; border-color: #2f6f63;
  }
  .oh-stepper-nav__item {
    flex: 1; display: flex; align-items: center;
    padding: 3px 10px 20px; margin-top: -2px;
    border-radius: 8px; cursor: pointer; text-decoration: none; color: inherit;
  }
  .oh-stepper-nav__item:hover { background: rgba(47,111,99,0.08); }
  .oh-stepper-nav__li.is-active .oh-stepper-nav__item { color: #2f6f63; font-weight: 600; }
  .oh-stepper-nav__label { font-size: 0.85rem; }
  .oh-stepper-nav__li.is-locked { opacity: 0.55; }
  .oh-stepper-nav__li.is-locked .oh-stepper-nav__num { background: #eceeee; color: #999; }
  .oh-stepper-nav__item--locked { cursor: not-allowed; }
  .oh-stepper-nav__item--locked:hover { background: none; }
  @media (max-width: 900px) {
    .oh-stepper-page { flex-direction: column; }
    .oh-stepper-page__nav { width: 100%; min-width: 0; }
  }

  .oh-step { display: flex; flex-direction: column; flex: 1; min-height: 0; max-width: 100%; }
  .oh-step > form { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .oh-step__body { flex: 1; overflow-y: auto; padding-bottom: 16px; }
  .oh-step__header { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 22px; }
  .oh-step__header--with-action { justify-content: space-between; align-items: center; }
  .oh-step__icon { font-size: 28px; color: #2f6f63; flex: none; margin-top: 2px; }
  .oh-step__footer {
    flex: none;
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 32px; margin: 0 -32px;
    background: var(--oh-body-bg, #fff);
    border-top: 1px solid var(--oh-border-color, #e4e6ef);
  }
  .oh-step textarea, .oh-step input[type=text], .oh-step input[type=date], .oh-step input[type=number], .oh-step input[type=file] {
    width: 100%;
  }
  .oh-step-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .oh-step-grid { grid-template-columns: 1fr; } }
  .oh-field label { display: block; font-size: 0.8rem; color: var(--oh-text-muted, #666); margin-bottom: 4px; }

  .oh-file-upload__current {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 0.82rem; margin-bottom: 8px;
  }
  .oh-file-upload__current-icon { font-size: 17px; color: #2f6f63; flex: none; }
  .oh-file-upload__current-link { color: #2f6f63; font-weight: 600; text-decoration: none; }
  .oh-file-upload__current-link:hover { text-decoration: underline; }
  .oh-file-upload__remove {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.78rem; color: #b3402f; cursor: pointer; user-select: none;
    margin-left: auto;
  }
  .oh-file-upload__remove input[type="checkbox"] {
    position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;
  }
  .oh-file-upload__remove:has(input:checked) { text-decoration: line-through; opacity: 0.7; }
  .oh-file-upload__dropzone {
    display: flex; align-items: center; gap: 10px;
    border: 1.5px dashed var(--oh-border-color, #e4e6ef);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    background: rgba(0, 0, 0, 0.015);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .oh-file-upload__dropzone:hover, .oh-file-upload__dropzone.is-dragover {
    border-color: #2f6f63; background: rgba(47,111,99,0.05);
  }
  .oh-file-upload__dropzone input[type="file"] { display: none; }
  .oh-file-upload__dropzone-icon { font-size: 19px; color: #2f6f63; flex: none; }
  .oh-file-upload__dropzone-text { font-size: 0.8rem; color: var(--oh-text-muted, #777); }

  .oh-empty-hint {
    display: flex; align-items: center; gap: 8px;
    color: var(--oh-text-muted, #888); font-size: 0.85rem;
    padding: 14px; border: 1px dashed var(--oh-border-color, #e4e6ef); border-radius: 8px;
  }
  .oh-empty-hint ion-icon { font-size: 20px; }

  .oh-chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .oh-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 16px; border-radius: 20px;
    border: 1px solid var(--oh-border-color, #e4e6ef);
    background: var(--oh-body-bg, #fff);
    font-size: 0.82rem; cursor: pointer; user-select: none;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .oh-chip input[type="checkbox"] {
    position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;
  }
  .oh-chip:hover { border-color: #2f6f63; }
  .oh-chip:has(input:checked) { background: #2f6f63; border-color: #2f6f63; color: #fff; }

  .oh-task-group { margin-bottom: 18px; }
  .oh-task-group__title {
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 0.85rem; color: var(--oh-text-muted, #666);
    text-transform: uppercase; letter-spacing: 0.02em;
    padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px solid var(--oh-border-color, #e4e6ef);
  }
  .oh-task-group__title ion-icon { font-size: 16px; color: #2f6f63; }

  .oh-checklist-row {
    display: flex; flex-direction: column; gap: 8px;
    border: 1px solid var(--oh-border-color, #e4e6ef); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 8px;
  }
  .oh-checklist-row__title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; }
  .oh-checklist-row__title strong { font-size: 0.88rem; word-break: break-word; }
  .oh-checklist-row__title .oh-text-light { word-break: break-word; }
  .oh-checklist-row__controls {
    display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  }
  .oh-checklist-row__chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .oh-checklist-row__assignee-wrap { width: 190px; flex: none; }
  .oh-checklist-row__assignee-wrap .select2-container { width: 100% !important; }
  .oh-checklist-row__assignee-wrap .select2-selection { min-height: 30px; font-size: 0.78rem; }
  .oh-checklist-row__assignee { font-size: 0.78rem; padding: 4px 10px; }
  .oh-check-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 11px; border-radius: 20px;
    border: 1px solid var(--oh-border-color, #e4e6ef);
    background: var(--oh-body-bg, #fff);
    font-size: 0.72rem; font-weight: 600; color: var(--oh-text-muted, #777);
    cursor: pointer; user-select: none; white-space: nowrap;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .oh-check-chip input[type="checkbox"] {
    position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none;
  }
  .oh-check-chip:hover { border-color: #2f6f63; }
  .oh-check-chip:has(input:checked) { background: #2f6f63; border-color: #2f6f63; color: #fff; }
  .oh-doc-icon { font-size: 18px; color: #2f6f63; }

  .oh-status-pill {
    display: inline-block; font-size: 0.62rem; padding: 2px 9px;
    border-radius: 20px; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .oh-status-pill--requested { background: #eee; color: #666; }
  .oh-status-pill--submitted { background: #e3ecf7; color: #3e6b99; }
  .oh-status-pill--under_verification { background: #f3e6cc; color: #a6672e; }
  .oh-status-pill--approved { background: #dcedde; color: #3e7d4f; }
  .oh-status-pill--rejected { background: #f3ddd7; color: #b3402f; }

  .oh-doc-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: #f1f3f0; border-radius: 20px; padding: 4px 12px 4px 10px; font-size: 0.8rem;
  }

  .oh-doc-request-list { display: flex; flex-direction: column; gap: 8px; }
  .oh-doc-request-row {
    display: flex; gap: 12px; align-items: center;
    border: 1px solid var(--oh-border-color, #e4e6ef); border-radius: 10px; padding: 10px 12px;
    transition: border-color 0.15s ease;
  }
  .oh-doc-request-row:hover { border-color: #c9d6d3; }
  .oh-doc-request-row__icon {
    width: 34px; height: 34px; border-radius: 8px; flex: none;
    background: rgba(47,111,99,0.1); color: #2f6f63;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .oh-doc-request-row__body { flex: 1; min-width: 0; }
  .oh-doc-request-row__title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.88rem; }
  .oh-doc-request-row__title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .oh-doc-request-row__desc {
    font-size: 0.78rem; color: var(--oh-text-muted, #888); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .oh-doc-request-row__meta { display: flex; gap: 14px; font-size: 0.72rem; color: var(--oh-text-muted, #aaa); margin-top: 3px; }
  .oh-doc-request-row__cancel {
    flex: none; border: none; background: none; color: var(--oh-text-muted, #999);
    font-size: 16px; cursor: pointer; padding: 4px;
  }
  .oh-doc-request-row__cancel:hover { color: #b3402f; }

  .oh-doc-tabs { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--oh-border-color, #e4e6ef); }
  .oh-doc-tab {
    display: inline-flex; align-items: center; gap: 7px;
    font-weight: 600; font-size: 0.85rem; color: var(--oh-text-muted, #666);
    background: none; border: none; padding: 10px 6px 12px; cursor: pointer; position: relative;
  }
  .oh-doc-tab .tab-count {
    font-size: 0.72rem; font-weight: 600; color: var(--oh-text-muted, #888);
    background: #eceeee; border-radius: 20px; padding: 1px 7px;
  }
  .oh-doc-tab::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: transparent; border-radius: 2px 2px 0 0;
  }
  .oh-doc-tab.active { color: #2f6f63; }
  .oh-doc-tab.active::after { background: #2f6f63; }
  .oh-doc-tab.active .tab-count { background: rgba(47,111,99,0.12); color: #2f6f63; }
  .oh-doc-tab-panel { display: none; }
  .oh-doc-tab-panel.active { display: block; }

  .oh-doc-verify-row {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;
    border: 1px solid var(--oh-border-color, #e4e6ef); border-radius: 10px; padding: 14px;
  }
  .oh-doc-verify-row__body { flex: 1; min-width: 200px; }
  .oh-doc-verify-row__actions { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; flex: none; }
  .oh-doc-verify-row__actions form { display: flex; gap: 6px; align-items: center; }

  .oh-finalize-preview { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  @media (max-width: 640px) { .oh-finalize-preview { grid-template-columns: 1fr; } }
  .oh-finalize-card {
    border: 1px solid var(--oh-border-color, #e4e6ef); border-radius: 10px;
    padding: 14px; font-size: 0.85rem;
  }
  .oh-finalize-card--muted { background: #faf7ee; }
  .oh-finalize-card--wide { grid-column: 1 / -1; }
  .oh-finalize-card__title {
    display: flex; align-items: center; gap: 6px;
    font-weight: 600; font-size: 0.8rem; margin-bottom: 6px; color: #2f6f63;
  }
  .oh-finalize-card__scroll {
    max-height: 220px; overflow-y: auto; font-size: 0.85rem; line-height: 1.55;
    word-break: break-word;
  }
  .oh-finalize-card__scroll p { margin: 0 0 0.6em; }
  .oh-finalize-card__scroll p:last-child { margin-bottom: 0; }

  .oh-stepper-messages { margin-bottom: 16px; flex: none; }
  .oh-stepper-messages .oh-alert {
    padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 8px;
  }
  .oh-stepper-messages .oh-alert--error, .oh-stepper-messages .oh-alert--danger { background: #f3ddd7; color: #b3402f; }
  .oh-stepper-messages .oh-alert--success { background: #dcedde; color: #3e7d4f; }
  .oh-stepper-messages .oh-alert--info { background: #e3ecf7; color: #3e6b99; }
  .oh-stepper-messages .oh-alert--warning { background: #f3e6cc; color: #a6672e; }
</style>
{% endblock content %}
