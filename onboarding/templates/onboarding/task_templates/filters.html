{% load i18n %}
<div class="oh-dropdown__filter-body">
  <div class="oh-input-group">
    <label class="oh-label" for="{{ f.candidate.id_for_label }}">{{ f.candidate.label }}</label>
    {{ f.candidate }}
  </div>
  <div class="oh-input-group">
    <label class="oh-label" for="{{ f.status.id_for_label }}">{{ f.status.label }}</label>
    {{ f.status }}
  </div>
  <div class="oh-input-group">
    <label class="oh-label" for="{{ f.phase.id_for_label }}">{{ f.phase.label }}</label>
    {{ f.phase }}
  </div>
  {% if f.assignee %}
  <div class="oh-input-group">
    <label class="oh-label" for="{{ f.assignee.id_for_label }}">{{ f.assignee.label }}</label>
    {{ f.assignee }}
  </div>
  {% endif %}
</div>
<div class="oh-dropdown__filter-footer">
  <button
    type="submit"
    id="applyFilter"
    class="oh-btn oh-btn--secondary oh-btn--small w-100 filterButton"
    onclick="event.stopPropagation()"
  >{% trans "Filter" %}</button>
</div>
