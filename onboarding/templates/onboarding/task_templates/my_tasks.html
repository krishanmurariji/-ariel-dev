{% extends "index.html" %}
{% load i18n %}
{% block content %}
<div class="oh-wrapper">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div>
      <h3 class="text-lg font-semibold m-0">{% trans "My Tasks" %}</h3>
    </div>

    <form
      id="myTasksFilterForm"
      hx-get="{% url 'my-checklist-tasks-board' %}"
      hx-target="#myTasksBoard"
      hx-push-url="true"
      class="flex items-center gap-2 flex-wrap"
      onsubmit="event.preventDefault();"
    >
      <input type="hidden" name="view" value="{{ initial_view }}">

      <div class="relative">
        <input
          type="text"
          id="myTasksSearch"
          name="search"
          value="{{ filter_form.search.value|default_if_none:'' }}"
          class="text-color-600 ps-8 p-1.5 pb-2 placeholder:text-xs w-full border border-dark-50 rounded-md focus-visible:outline-0 placeholder:text-dark-100 text-sm [transition:.3s] focus:border-primary-600"
          aria-label="{% trans 'Search Input' %}"
          placeholder="{% trans 'Search' %}"
          autocomplete="off"
        >
        <i class="fas fa-search absolute left-3 top-[1px] bottom-0 m-auto flex items-center opacity-50 text-xs"></i>
      </div>

      <ul class="oh-view-types" style="margin-bottom: 0;">
        <li class="oh-view-type">
          <a
            class="oh-btn oh-btn--view {% if initial_view == 'kanban' %}oh-btn--view-active{% endif %}"
            title="{% trans 'Kanban' %}"
            onclick="document.cookie='onboarding_my_tasks_view=kanban;path=/;max-age=31536000'; $('[name=view]').val('kanban'); $('.filterButton')[0].click();"
          ><ion-icon name="albums-outline"></ion-icon></a>
        </li>
        <li class="oh-view-type">
          <a
            class="oh-btn oh-btn--view {% if initial_view == 'list' %}oh-btn--view-active{% endif %}"
            title="{% trans 'List' %}"
            onclick="document.cookie='onboarding_my_tasks_view=list;path=/;max-age=31536000'; $('[name=view]').val('list'); $('.filterButton')[0].click();"
          ><ion-icon name="list-outline"></ion-icon></a>
        </li>
      </ul>

      <div class="oh-dropdown" x-data="{open: false}">
        <button type="button" class="oh-btn ml-2" @click="open = !open">
          <ion-icon name="filter" class="mr-1"></ion-icon>{% trans "Filter" %}
        </button>
        <div
          class="oh-dropdown__menu oh-dropdown__menu--right oh-dropdown__filter p-4"
          x-show="open"
          @click.outside="open = false"
          style="display: none;"
        >
          {% include "onboarding/task_templates/filters.html" with f=filter_form %}
        </div>
      </div>
    </form>
  </div>

  <div
    id="myTasksBoard"
    hx-get="{% url 'my-checklist-tasks-board' %}?{{ initial_board_query }}"
    hx-trigger="load"
    hx-target="this"
  >
    <div class="bg-white rounded-md shadow-card p-12 text-xs text-[#9AA1AC] text-center">{% trans "Loading tasks..." %}</div>
  </div>
</div>

<script>
  // typing in the search box filters the board after a short pause, like the search box on the other screens
  (function () {
    var timer;
    $(document).on("keyup", "#myTasksSearch", function () {
      var form = this.form;
      clearTimeout(timer);
      timer = setTimeout(function () { form.requestSubmit(); }, 500);
    });
  })();
</script>

<style>
  .oh-view-types { display: flex; list-style: none; margin: 0; padding: 0; gap: 4px; }
  .oh-btn--view-active { background: var(--oh-primary, #E54F38); color: #fff; }

  /* The generic filter-tags bar's "Save filter" button assumes a page
     that also offers a way to browse/re-apply saved filters later (the
     generic nav's own filter panel does) - this page's filter panel
     (filters.html) is custom and never built that out, so saving one
     here is a dead end with no way back to it. Hide just the entry
     point rather than build out that whole feature. */
  #myTasksBoard #saveFilterBtn { display: none; }

  /* Shared by _status_pill.html - defined once here rather than in the
     partial, since it's rendered once per row/card. */
  .oh-status-pill {
    display: inline-block; padding: 2px 10px; border-radius: 9999px;
    font-size: 11px; font-weight: 600; color: #fff;
    background: var(--status-color, #6c757d);
  }
  .oh-status-pill[data-status="stuck"]     { --status-color: #ef4444; }
  .oh-status-pill[data-status="todo"]      { --status-color: #6c757d; }
  .oh-status-pill[data-status="scheduled"] { --status-color: #3b82f6; }
  .oh-status-pill[data-status="ongoing"]   { --status-color: #f59e0b; }
  .oh-status-pill[data-status="done"]      { --status-color: #22c55e; }
</style>
{% endblock content %}
