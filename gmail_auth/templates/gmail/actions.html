{% load i18n %}
<div class="oh-btn-group">
  {% if perms.gmail_auth.change_googleapi and instance.token %}
    <a href="{% url 'refresh_google_token' instance.pk %}" class="oh-btn oh-btn--light-bkg w-100" title="{% trans 'Refresh Token' %}"><ion-icon name="refresh"></ion-icon></a>
  {% endif %}
  {% if perms.gmail_auth.change_googleapi %}
    <a target="_blank" href="/gmail/login/" class="oh-btn oh-btn--light-bkg w-100" title="{% trans 'Login' %}"><ion-icon name="log-in-outline"></ion-icon></a>
  {% endif %}
  {% if perms.gmail_auth.change_googleapi %}
    <a hx-get="{% url 'gmail_server_change' instance.id %}?instance_ids={{ instance.ordered_ids }}" onclick="event.stopPropagation()" hx-target="#genericModalBody" data-toggle="oh-modal-toggle" data-target="#genericModal" class="oh-btn oh-btn--light-bkg w-100" title="{% trans 'Edit' %}"><ion-icon name="create-outline" role="img" class="md hydrated" aria-label="create outline"></ion-icon></a>
  {% endif %}
  {% if perms.gmail_auth.delete_googleapi %}
    <a onclick="event.stopPropagation()" hx-get="{% url 'generic-delete' %}?pk={{instance.pk}}&model=gmail_auth.GoogleApi" data-toggle="oh-modal-toggle" data-target="#deleteConfirmation" hx-target="#deleteConfirmationBody" type="submit" class="oh-btn oh-btn--danger-outline oh-btn--light-bkg w-100" title="{% trans 'Remove' %}"><ion-icon name="trash-outline" role="img" class="md hydrated" aria-label="trash outline"></ion-icon></a>
  {% endif %}
</div>
