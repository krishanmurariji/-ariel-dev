# Lean stack for the 1 GB Always Free AMD Micro VM (VM.Standard.E2.1.Micro).
# web + Postgres + Caddy only: no Redis (single worker => in-memory chat layer),
# no nginx (Whitenoise serves static, Caddy serves hardened /media).
# Run: docker compose -f docker-compose.oracle-micro.yml --env-file .env.oracle up -d --build
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env.oracle
    mem_limit: 450m
    environment:
      DEBUG: "False"
      GUNICORN_WORKERS: "1"
      DATABASE_URL: postgres://horilla:${POSTGRES_PASSWORD}@db:5432/horilla
      CHANNEL_LAYER_BACKEND: inmemory
    volumes:
      - media:/app/media
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: ${DOMAIN}", "http://localhost:8000/health/"]
      interval: 60s
      timeout: 30s
      start_period: 180s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 200m
    command: postgres -c shared_buffers=48MB -c max_connections=30 -c work_mem=2MB -c maintenance_work_mem=32MB -c effective_cache_size=128MB
    environment:
      POSTGRES_DB: horilla
      POSTGRES_USER: horilla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horilla -d horilla"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 80m
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile.micro:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  media:
  postgres_data:
  caddy_data:
  caddy_config:
