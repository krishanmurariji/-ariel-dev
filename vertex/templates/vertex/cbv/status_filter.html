{% load i18n %}
<div class="oh-dropdown__filter-body">
    <div class="oh-accordion">
        <div class="oh-accordion-header"
            onclick="event.stopImmediatePropagation();$(this).parent().toggleClass('oh-accordion--show');"
        >{% trans "Status update" %}</div>
        <div class="oh-accordion-body">
            <div class="row">
                <div class="col-sm-12 col-md-12 col-lg-6">
                    <div class="oh-input-group">
                        <label class="oh-label" for="{{form.project.id_for_label}}">{{ form.project.label }}</label>
                        {{form.project}}
                    </div>
                    <div class="oh-input-group">
                        <label class="oh-label" for="{{form.date_from.id_for_label}}">{{ form.date_from.label }}</label>
                        {{form.date_from}}
                    </div>
                </div>
                <div class="col-sm-12 col-md-12 col-lg-6">
                    <div class="oh-input-group">
                        <label class="oh-label" for="{{form.status.id_for_label}}">{{ form.status.label }}</label>
                        {{form.status}}
                    </div>
                    <div class="oh-input-group">
                        <label class="oh-label" for="{{form.date_to.id_for_label}}">{{ form.date_to.label }}</label>
                        {{form.date_to}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
