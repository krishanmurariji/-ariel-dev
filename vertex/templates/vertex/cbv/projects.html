{% extends "index.html" %}
{% load i18n static %}

{% block content %}
<style>
    .planning--dot { background-color: cyan; }
    .active--dot { background-color: rgb(103, 171, 238); }
    .on-hold--dot { background-color: orange; }
    .completed--dot { background-color: yellowgreen; }
    .cancelled--dot { background-color: red; }
    .status-planning { border-left: 3.4px solid cyan !important; border-radius: 4px 0 0 4px; }
    .status-active { border-left: 3.4px solid rgb(103, 171, 238) !important; border-radius: 4px 0 0 4px; }
    .status-on_hold { border-left: 3.4px solid orange !important; border-radius: 4px 0 0 4px; }
    .status-completed { border-left: 3.4px solid yellowgreen !important; border-radius: 4px 0 0 4px; }
    .status-cancelled { border-left: 3.4px solid red !important; border-radius: 4px 0 0 4px; }
</style>
<div hx-get="{% url 'vertex-project-nav' %}?{{request.GET.urlencode}}" hx-trigger="load"></div>
<div class="oh-checkpoint-badge mb-2" id="selectedInstances" data-ids="[]" data-clicked="" style="display: none"></div>
<div class="oh-wrapper" id="listContainer">
    <div class="animated-background"></div>
</div>
{% endblock %}
