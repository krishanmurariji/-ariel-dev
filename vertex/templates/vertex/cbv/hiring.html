{% extends "index.html" %}
{% load i18n static %}

{% block content %}
<style>
    .status-open { border-left: 3.4px solid #3b82f6 !important; border-radius: 4px 0 0 4px; }
    .status-under_review { border-left: 3.4px solid #8b5cf6 !important; border-radius: 4px 0 0 4px; }
    .status-need_more_information { border-left: 3.4px solid #f59e0b !important; border-radius: 4px 0 0 4px; }
    .status-approved { border-left: 3.4px solid #16a34a !important; border-radius: 4px 0 0 4px; }
    .status-in_hiring_process { border-left: 3.4px solid #0ea5e9 !important; border-radius: 4px 0 0 4px; }
    .status-candidate_shared { border-left: 3.4px solid #14b8a6 !important; border-radius: 4px 0 0 4px; }
    .status-fulfilled { border-left: 3.4px solid #15803d !important; border-radius: 4px 0 0 4px; }
    .status-rejected { border-left: 3.4px solid #dc2626 !important; border-radius: 4px 0 0 4px; }
    .status-closed { border-left: 3.4px solid #6b7280 !important; border-radius: 4px 0 0 4px; }
</style>
<div hx-get="{% url 'vertex-hiring-nav' %}?{{request.GET.urlencode}}" hx-trigger="load"></div>
<div class="oh-wrapper" id="listContainer">
    <div class="animated-background"></div>
</div>
{% endblock %}
