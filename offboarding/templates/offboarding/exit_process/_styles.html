{# Small, self-contained styles for the exit screens. The active theme does not load the older #}
{# table / soft-button styles, so these screens carry their own and look the same everywhere. #}
<style>
    .xp-table-wrap { border: 1px solid rgba(120,130,150,0.3); border-radius: 8px; overflow-x: auto; margin-bottom: 16px; }
