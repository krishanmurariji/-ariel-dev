{# Shared look for the Exit Settings and Exit Survey pages, and the pop-up that confirms a change. #}
<style>
    .xu-card { border: 1px solid rgba(120,130,150,0.28); border-radius: 8px; overflow: hidden; margin-bottom: 20px; background: #fff; }
    body.dark .xu-card { background: transparent; }
    .xu-card__head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 14px 18px; background: rgba(120,130,150,0.09); border-bottom: 1px solid rgba(120,130,150,0.22); }
    .xu-card__head h5 { margin: 0; font-size: 0.92rem; font-weight: 600; }
    .xu-card__head p { margin: 3px 0 0; font-size: 0.76rem; opacity: 0.7; max-width: 640px; }
    .xu-card__actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .xu-card__body { padding: 18px; }
    .xu-card__body.xu-flush { padding: 0; }
    .xu-note { font-size: 0.78rem; opacity: 0.75; margin: 0 0 12px; }

    /* buttons */
    .xu-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; margin: 0; border-radius: 6px; font-size: 0.82rem; font-weight: 500; line-height: 1; white-space: nowrap; cursor: pointer; }
    .xu-btn ion-icon { font-size: 1.05rem; flex: none; }
    .xu-icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; margin: 0; border-radius: 6px; border: 1px solid rgba(120,130,150,0.35); background: transparent; color: inherit; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
    .xu-icon-btn ion-icon { font-size: 1.1rem; }
    .xu-icon-btn:hover { background: rgba(120,130,150,0.16); }
    .xu-icon-btn.is-danger { color: #d93b3b; border-color: rgba(217,59,59,0.35); }
    .xu-icon-btn.is-danger:hover { background: rgba(217,59,59,0.12); border-color: #d93b3b; }
    .xu-icon-btn.is-on { color: #e0a100; border-color: rgba(224,161,0,0.45); }
    .xu-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }

    /* tables */
    .xu-table-wrap { overflow-x: auto; }
    .xu-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    .xu-table th { text-align: left; font-weight: 600; font-size: 0.76rem; letter-spacing: .02em; text-transform: uppercase; opacity: .75; padding: 10px 18px; border-bottom: 1px solid rgba(120,130,150,0.25); white-space: nowrap; }
    .xu-table td { padding: 12px 18px; border-bottom: 1px solid rgba(120,130,150,0.15); vertical-align: middle; }
    .xu-table tbody tr:last-child td { border-bottom: 0; }
    .xu-table tbody tr:hover td { background: rgba(120,130,150,0.05); }
    .xu-table .xu-num { width: 44px; opacity: .6; }
    .xu-table .xu-right { text-align: right; }
    .xu-title { font-weight: 500; }
    .xu-sub { font-size: 0.76rem; opacity: 0.7; margin-top: 2px; }
    .xu-empty { padding: 28px 18px; text-align: center; font-size: 0.85rem; opacity: .7; }

    /* small labels */
    .xu-badge { display: inline-block; font-size: 0.68rem; font-weight: 500; padding: 2px 9px; border-radius: 10px; background: rgba(120,130,150,0.18); margin-left: 6px; vertical-align: middle; }
    .xu-badge.is-default { background: rgba(34,160,90,0.18); color: #1b8a4d; }
    .xu-badge.is-warn { background: rgba(224,161,0,0.2); color: #9a6f00; }
    .xu-badge.is-off { background: rgba(217,59,59,0.14); color: #c03030; }
    .xu-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 16px; border: 1px solid rgba(120,130,150,0.35); background: transparent; color: inherit; font-size: 0.8rem; cursor: pointer; margin: 0; }
    .xu-pill ion-icon { font-size: 1rem; }
    .xu-pill:hover { background: rgba(120,130,150,0.14); }

    /* rows of settings */
    .xu-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid rgba(120,130,150,0.18); }
    .xu-row:last-of-type { border-bottom: 0; }
    .xu-row h3 { font-size: 0.875rem; font-weight: 500; margin: 0; }
    .xu-row p { font-size: 0.76rem; opacity: 0.7; margin: 3px 0 0; max-width: 620px; }
    .xu-block { padding: 12px 0; border-bottom: 1px solid rgba(120,130,150,0.18); }
    .xu-block h3 { font-size: 0.875rem; font-weight: 500; margin: 0; }
    .xu-block p { font-size: 0.76rem; opacity: 0.7; margin: 3px 0 0; }
    .xu-radio label { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; cursor: pointer; font-size: 0.85rem; }
    .xu-footer { display: flex; align-items: center; gap: 12px; margin-top: 16px; }

    /* two-column groups of reasons */
    .xu-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .xu-col { padding: 16px 18px; }
    .xu-col + .xu-col { border-left: 1px solid rgba(120,130,150,0.2); }
    .xu-col__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .xu-col__head h6 { margin: 0; font-size: 0.82rem; font-weight: 600; }
    .xu-list-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(120,130,150,0.15); }
    .xu-list-row:last-child { border-bottom: 0; }
    @media (max-width: 860px) { .xu-cols { grid-template-columns: 1fr; } .xu-col + .xu-col { border-left: 0; border-top: 1px solid rgba(120,130,150,0.2); } }

    /* windows (modals) */
    .xu-modal-body { padding: 4px 2px 2px; }
    .xu-field { margin-bottom: 14px; }
    .xu-field label.xu-label { display: block; font-size: 0.8rem; font-weight: 500; margin-bottom: 5px; }
    .xu-field .xu-hint { font-size: 0.74rem; opacity: 0.65; margin-top: 4px; }
    .xu-check { display: inline-flex; align-items: center; gap: 8px; font-size: 0.84rem; cursor: pointer; margin-right: 18px; }
    .xu-modal-actions { display: flex; flex-direction: row-reverse; gap: 10px; margin-top: 18px; }
    .xu-modal-actions .oh-btn { margin: 0; }
    .xu-person { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .xu-person img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; }
    .xu-people { max-height: 340px; overflow-y: auto; border: 1px solid rgba(120,130,150,0.25); border-radius: 8px; }
    .xu-people .xu-list-row { padding: 10px 14px; }
    .xu-people-controls { display: flex; align-items: center; gap: 8px; flex: none; }
    .xu-select { height: 32px; min-width: 150px; font-size: 0.8rem; padding: 0 8px; }
    .xu-saved { font-size: 0.8rem; color: #1b8a4d; }
    #xsModalBody.xu-wide { max-width: 980px; width: 96vw; }
</style>
<div class="oh-modal" id="xsModal" role="dialog" aria-hidden="true">
    <div class="oh-modal__dialog" id="xsModalBody"></div>
</div>
<script>
    (function () {
        // One listener per page: the views tell the page what happened through the
        // HX-Trigger header. Show a pop-up, and close the open window after a success.
        if (window.__exitSettingsUi) return;
        window.__exitSettingsUi = true;
        // A window opens as soon as its content has arrived.
        document.body.addEventListener("htmx:afterSwap", function (event) {
            if (event.target && event.target.id === "xsModalBody") {
                // Long forms (task groups) get a wider window.
                event.target.classList.toggle("xu-wide", !!event.target.querySelector("[data-xu-wide]"));
                $("#xsModal").addClass("oh-modal--show");
            }
        });
        document.body.addEventListener("exitSettingsNotice", function (event) {
            var notice = event.detail || {};
            if (notice.close) {
                $("#xsModal").removeClass("oh-modal--show");
            }
            // The application's own pop-up (the same one every other settings page uses).
            $("#reloadMessagesButton").click();
        });
    })();
</script>
