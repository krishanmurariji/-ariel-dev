{% load i18n %}
{% trans "Copy questions from a Recruitment survey" as head_title %}
{% include "offboarding/exit_process/_modal_head.html" with title=head_title %}
<div class="oh-modal__dialog-body oh-modal__dialog-relative">
    <form class="xu-modal-body" hx-post="{% url 'exit-survey-import' %}" hx-swap="none" hx-disabled-elt="find button[type='submit']">
        {% csrf_token %}
        <p class="xu-note">{% trans "Reuse questions that already exist. Questions already here, and file-upload questions, are skipped." %}</p>
        <div class="xu-field">
            <label class="xu-label" for="xqTemplate">{% trans "Recruitment survey" %}</label>
            <select name="template" id="xqTemplate" class="oh-select w-100" required>
                <option value="">{% trans "Choose a survey" %}</option>
                {% for t in templates %}<option value="{{ t.pk }}">{{ t.title }}</option>{% endfor %}
            </select>
        </div>
        <div class="xu-modal-actions">
            <button type="submit" class="oh-btn oh-btn--secondary pl-4 pr-4">{% trans "Copy questions" %}</button>
            <button type="button" class="oh-btn oh-btn--light pl-4 pr-4" onclick="$(this).closest('.oh-modal--show').removeClass('oh-modal--show')">{% trans "Cancel" %}</button>
        </div>
    </form>
</div>
