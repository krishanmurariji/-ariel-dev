{% load i18n %}
<div class="flex items-center gap-3 mb-4 flex-wrap">
  <a class="text-primary-600 text-sm font-semibold flex items-center gap-1" href="{% url 'pp-run-payroll' %}?year={{ year }}&month={{ month }}">
    <ion-icon name="arrow-back-outline"></ion-icon>{% trans "Back" %}
  </a>
  <h2 class="text-lg font-bold">{{ step_meta.title }} <span class="text-sm font-normal text-dark-400">— {{ month_name }} {{ year }}</span></h2>
  <span class="flex-1"></span>
  {% if run.is_locked %}
    <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-success-light text-success-dark">{% trans "Locked" %}</span>
  {% else %}
    <button type="submit" form="stepform" class="oh-btn oh-btn--secondary">{% trans "Save & Close" %}</button>
  {% endif %}
</div>
