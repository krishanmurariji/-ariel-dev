{% load static i18n %}
<style>
    /*
     * Two-part sidebar: a thin icon rail (one icon per module) with, directly
     * to its right, a panel listing the submenu of the active module.
     */
    :root {
        --sb-rail: 3.5rem;   /* 56 px  - icon strip */
        --sb-panel: 12.5rem; /* 200 px - submenu panel */
        --sb-accent: {{ theme_obj.primary_600|default:"#E54F38" }};
    }

    #sidebar {
        display: flex;
        align-items: stretch;
    }

    /* ---------- Rail ---------- */
    #sidebarRail {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: var(--sb-rail);
        flex: 0 0 var(--sb-rail);
        padding: 0.75rem 0;
        background: var(--sb-accent);
    }
    #sidebarRail nav {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.375rem;
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    #sidebarRail nav::-webkit-scrollbar {
        display: none;
    }

    .sb-rail-btn {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.5rem;
        height: 2.5rem;
        flex-shrink: 0;
        border: 0;
        border-radius: 0.625rem;
        background: transparent;
        cursor: pointer;
        transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .sb-rail-btn img {
        width: 1.125rem;
        height: 1.125rem;
        filter: brightness(0) invert(1);
    }
    .sb-rail-btn:hover {
        background: rgba(255, 255, 255, 0.16);
    }
    .sb-rail-btn:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
    }
    .sb-rail-btn.sb-active {
        background: rgba(255, 255, 255, 0.28);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    /* ---------- Submenu panel ---------- */
    #sidebarPanel {
        display: none;
        flex-direction: column;
        width: var(--sb-panel);
        flex: 0 0 var(--sb-panel);
        background: #ffffff;
        border-right: 1px solid #e5e7eb;
    }
    #sidebar.sb-panel-open #sidebarPanel {
        display: flex;
        animation: sb-panel-in 0.18s ease;
    }
    @keyframes sb-panel-in {
        from { opacity: 0; transform: translateX(-8px); }
        to   { opacity: 1; transform: translateX(0); }
    }
    .sb-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 1rem 0.75rem 0.75rem 1rem;
        border-bottom: 1px solid #f3f4f6;
    }
    .sb-panel-title {
        margin: 0;
        font-size: 0.9375rem;
        font-weight: 600;
        line-height: 1.25;
        color: #111827;
    }
    #sidebarPinBtn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1.75rem;
        height: 1.75rem;
        flex-shrink: 0;
        border: 0;
        border-radius: 0.5rem;
        background: transparent;
        color: #9ca3af;
        cursor: pointer;
        transition: background-color 0.15s ease, color 0.15s ease;
    }
    #sidebarPinBtn:hover {
        background: #f3f4f6;
        color: #374151;
    }
    #sidebarPinBtn .sb-lock-closed { display: none; }
    #sidebarPinBtn .sb-lock-open { display: block; }
    #sidebar.sb-locked #sidebarPinBtn {
        background: #f3f4f6;
        color: #374151;
    }
    #sidebar.sb-locked #sidebarPinBtn .sb-lock-open { display: none; }
    #sidebar.sb-locked #sidebarPinBtn .sb-lock-closed { display: block; }
    .sb-panel-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 0.5rem 0.5rem 1rem;
    }
    .sb-section {
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
        margin: 0;
        padding: 0;
        list-style: none;
    }
    .sb-section[hidden] {
        display: none;
    }
    .sb-section a.sidebar-subnav-link {
        display: block;
        padding: 0.4375rem 0.75rem;
        border-radius: 0.5rem;
        font-size: 0.8125rem;
        line-height: 1.25rem;
        color: #4b5563;
        text-decoration: none;
        transition: background-color 0.12s ease, color 0.12s ease;
    }
    .sb-section a.sidebar-subnav-link:hover {
        background: #f3f4f6;
        color: #111827;
    }
    .sb-section a.sidebar-subnav-link.oh-sidebar-active-link {
        background: color-mix(in srgb, var(--sb-accent) 12%, transparent);
        color: var(--sb-accent);
        font-weight: 600;
    }

    /* ---------- Page layout follows the sidebar ---------- */
    .oh-main-content {
        margin-left: var(--sb-rail);
        transition: margin-left 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .oh-main-header {
        right: 0;
        left: var(--sb-rail);
        transition: left 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #sidebar ~ #floating-buttons .fab-container {
        left: var(--sb-rail);
        transition: left 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s ease, box-shadow 0.3s ease;
    }
    #sidebar.sb-locked.sb-panel-open ~ .oh-main-content {
        margin-left: calc(var(--sb-rail) + var(--sb-panel));
    }
    #sidebar.sb-locked.sb-panel-open ~ .oh-main-content .oh-main-header {
        left: calc(var(--sb-rail) + var(--sb-panel));
    }
    #sidebar.sb-locked.sb-panel-open ~ #floating-buttons .fab-container {
        left: calc(var(--sb-rail) + var(--sb-panel));
    }

    /* Unlocked, or a narrow screen: the panel floats over the page instead of pushing it */
    #sidebar:not(.sb-locked).sb-panel-open #sidebarPanel {
        position: fixed;
        top: 0;
        bottom: 0;
        left: var(--sb-rail);
        z-index: 60;
        box-shadow: 8px 0 24px -8px rgba(15, 23, 42, 0.25);
    }
    @media (max-width: 767px) {
        #sidebar.sb-panel-open #sidebarPanel {
            position: fixed;
            top: 0;
            bottom: 0;
            left: var(--sb-rail);
            z-index: 60;
            box-shadow: 8px 0 24px -8px rgba(15, 23, 42, 0.25);
        }
        #sidebar.sb-locked.sb-panel-open ~ .oh-main-content {
            margin-left: var(--sb-rail);
        }
        #sidebar.sb-locked.sb-panel-open ~ .oh-main-content .oh-main-header {
            left: var(--sb-rail);
        }
        #sidebar.sb-locked.sb-panel-open ~ #floating-buttons .fab-container {
            left: var(--sb-rail);
        }
    }

    /* ---------- Dark mode ---------- */
    body.dark #sidebarRail {
        background: {{ theme_obj.primary_800|default:"#C73F2A" }};
    }
    body.dark #sidebarPanel {
        background: #111827;
        border-color: #374151;
    }
    body.dark .sb-panel-head {
        border-color: #1f2937;
    }
    body.dark .sb-panel-title {
        color: #f3f4f6;
    }
    body.dark #sidebarPinBtn:hover,
    body.dark #sidebar.sb-locked #sidebarPinBtn,
    body.dark .sb-section a.sidebar-subnav-link:hover {
        background: rgba(255, 255, 255, 0.07);
        color: #e5e7eb;
    }
    body.dark .sb-section a.sidebar-subnav-link {
        color: #d1d5db;
    }
    body.dark .sb-section a.sidebar-subnav-link.oh-sidebar-active-link {
        background: color-mix(in srgb, var(--sb-accent) 22%, transparent);
        color: #ffffff;
    }

    @media (prefers-reduced-motion: reduce) {
        .oh-main-content,
        .oh-main-header,
        .sb-rail-btn,
        #sidebar ~ #floating-buttons .fab-container,
        #sidebar.sb-panel-open #sidebarPanel {
            animation: none !important;
            transition: none !important;
        }
    }
</style>
<div id="sidebar" class="fixed inset-y-0 left-0 z-50">
    <!-- Rail: one icon per module -->
    <div id="sidebarRail">
        <nav role="navigation" aria-label="{% trans 'Main navigation' %}">
            <a
                href="{% url 'dashboard' %}"
                class="sb-rail-btn sb-top-link"
                data-menu="Dashboard"
                title="{% trans 'Dashboard' %}"
                aria-label="{% trans 'Dashboard' %}"
                hx-get="{% url 'dashboard' %}"
                hx-target="#ohMainContent"
                hx-select="#ohMainContent > *"
                hx-swap="innerHTML show:window:top"
                hx-push-url="true"
            >
                <img src="{% static 'images/ui/dashboard.svg' %}" alt="">
            </a>
            {% for menues in sidebar %}
                <button
                    type="button"
                    class="sb-rail-btn"
                    data-menu="{{ menues.menu }}"
                    title="{{ menues.menu }}"
                    aria-label="{{ menues.menu }}"
                    aria-controls="sidebarPanel"
                    aria-expanded="false"
                >
                    <img src="{% static menues.img_src %}" alt="">
                </button>
            {% endfor %}
        </nav>
    </div>

    <!-- Panel: submenu of the active module -->
    <aside id="sidebarPanel" aria-label="{% trans 'Submenu' %}">
        <div class="sb-panel-head">
            <div class="min-w-0">
                <h2 id="sidebarPanelTitle" class="sb-panel-title"></h2>
            </div>
            <button
                type="button"
                id="sidebarPinBtn"
                title="{% trans 'Lock sidebar open' %}"
                aria-label="{% trans 'Lock sidebar open' %}"
                data-pin-label="{% trans 'Lock sidebar open' %}"
                data-unpin-label="{% trans 'Unlock sidebar (auto-collapses on hover-out)' %}"
            >
                <!-- Open padlock: shown while unlocked -->
                <svg class="sb-lock-open w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 1 1 9 0v3.75M3.75 21.75h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H3.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                </svg>
                <!-- Closed padlock: shown while locked open -->
                <svg class="sb-lock-closed w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                </svg>
            </button>
        </div>
        <div class="sb-panel-body">
            {% for menues in sidebar %}
                <ul class="sb-section sidebar-subnav" data-menu="{{ menues.menu }}" hidden>
                    {% for submenu in menues.submenu %}
                        <li>
                            <a
                                href="{{ submenu.redirect }}"
                                class="sidebar-subnav-link"
                                hx-get="{{ submenu.redirect }}"
                                hx-target="#ohMainContent"
                                hx-select="#ohMainContent > *"
                                hx-swap="innerHTML show:window:top"
                                hx-push-url="true"
                            >{{ submenu.menu }}</a>
                        </li>
                    {% endfor %}
                </ul>
            {% endfor %}
        </div>
    </aside>
</div>
<script>
    function highlightRow(checkbox) {
        checkbox.closest(".oh-sticky-table__tr").removeClass("highlight-selected");
        checkbox.closest("tr").removeClass("highlight-selected");
        if (checkbox.is(":checked")) {
          checkbox.closest(".oh-sticky-table__tr").addClass("highlight-selected");
          checkbox.closest("tr").addClass("highlight-selected");
        }
      }

      function toggleHighlight(ids) {
        if (!ids.length > 0) return;
        $.each(ids, function (indexInArray, id) {
          setTimeout(() => {
            $(`#${id}`)
              .closest(".oh-sticky-table__tr")
              .removeClass("highlight-selected");
            if ($(`#${id}`).is(":checked")) {
              $(`#${id}`)
                .closest(".oh-sticky-table__tr")
                .addClass("highlight-selected");
            }
          }, 1);
        });
      }

    function reloadSelectedCount(targetElement, storeKey = "selectedInstances") {
        var count = JSON.parse($(`#${storeKey}`).attr("data-ids") || "[]").length;
        id = targetElement.attr("id");
        if (id) {
            id = id.split("count_")[1];
        }
        if (count) {
            targetElement.html(count);
            targetElement.parent().removeClass("d-none");
            $(`#unselect_${id}, #export_${id}, #bulk_udate_${id}`).removeClass(
                "d-none"
            );
        } else {
            targetElement.parent().addClass("d-none");
            $(`#unselect_${id}, #export_${id}, #bulk_udate_${id}`).addClass(
                "d-none"
            );
        }
    }

    function removeHighlight() {
        setTimeout(function () {
            $(".toggle-highlight").removeClass("toggle-highlight");
        }, 200);
    }

    function removeId(element, storeKey = "selectedInstances") {
        id = element.val();
        viewId = element.attr("data-view-id");
        ids = JSON.parse($(`#${storeKey}`).attr("data-ids") || "[]");
        let elementToRemove = 5;
        if (ids[ids.length - 1] === id) {
            ids.pop();
        }
        ids = JSON.stringify(ids);
        $(`#${storeKey}`).attr("data-ids", ids);
    }
</script>
<script>
    (function () {
        var sidebarEl = document.getElementById("sidebar");
        if (!sidebarEl) return;

        var panelEl = document.getElementById("sidebarPanel");
        var titleEl = document.getElementById("sidebarPanelTitle");
        var pinBtn = document.getElementById("sidebarPinBtn");
        var railButtons = Array.prototype.slice.call(sidebarEl.querySelectorAll(".sb-rail-btn"));
        var sections = Array.prototype.slice.call(sidebarEl.querySelectorAll(".sb-section"));
        var subLinks = Array.prototype.slice.call(sidebarEl.querySelectorAll(".sidebar-subnav-link"));

        var activeMenu = null;
        var panelHidden = false;
        var locked = true; // locked: panel stays open and pushes the page; unlocked: it floats and closes on hover-out
        var leaveTimer = null;

        function store(key, value) {
            try { localStorage.setItem(key, value); } catch (_) {}
        }
        function recall(key) {
            try { return localStorage.getItem(key); } catch (_) { return null; }
        }

        function sectionFor(menu) {
            for (var i = 0; i < sections.length; i++) {
                if (sections[i].dataset.menu === menu) return sections[i];
            }
            return null;
        }

        // Draw the rail highlight and the panel from activeMenu / panelHidden.
        function render() {
            var section = activeMenu ? sectionFor(activeMenu) : null;
            var open = !!section && !panelHidden;
            sections.forEach(function (s) { s.hidden = s !== section; });
            railButtons.forEach(function (b) {
                var on = b.dataset.menu === activeMenu;
                b.classList.toggle("sb-active", on);
                if (b.tagName === "BUTTON") b.setAttribute("aria-expanded", on && open ? "true" : "false");
            });
            if (titleEl) titleEl.textContent = section ? activeMenu : "";
            sidebarEl.classList.toggle("sb-panel-open", open);
            sidebarEl.classList.toggle("sb-locked", locked);
            if (pinBtn) {
                var label = locked ? pinBtn.dataset.unpinLabel : pinBtn.dataset.pinLabel;
                if (label) { pinBtn.title = label; pinBtn.setAttribute("aria-label", label); }
                pinBtn.setAttribute("aria-pressed", locked ? "true" : "false");
            }
        }

        function setActiveMenu(menu) {
            activeMenu = menu;
            if (menu) store("activeSidebarMenu", menu);
        }

        function setPanelHidden(hidden) {
            panelHidden = hidden;
            store("sidebarPanelHidden", hidden ? "true" : "false");
            render();
        }

        // Longest matching submenu link wins, so /employee/ does not shadow /employee/employee-view/.
        function syncToUrl() {
            var path = window.location.pathname;
            var best = null;
            subLinks.forEach(function (l) {
                l.classList.remove("oh-sidebar-active-link");
                var href = l.getAttribute("href");
                if (!href || href === "/" || href === "#") return;
                // links such as /recruitment/cbv-pipeline/?closed=false carry a query; match on the path only
                href = href.split("?")[0].split("#")[0];
                if (!href || href === "/") return;
                if (path.indexOf(href) === 0 && (!best || href.length > best.bestPath.length)) {
                    l.bestPath = href;
                    best = l;
                }
            });
            if (best) {
                best.classList.add("oh-sidebar-active-link");
                var list = best.closest(".sb-section");
                if (list) setActiveMenu(list.dataset.menu);
            } else {
                var dash = sidebarEl.querySelector(".sb-top-link");
                var dashHref = dash && dash.getAttribute("href");
                if (dashHref && (path === "/" || path.indexOf(dashHref) === 0)) setActiveMenu("Dashboard");
            }
            render();
        }

        // ── Navigation helpers ───────────────────────────────────────────────

        var STANDALONE_URL_PATTERNS = [/^\/recruitment\/open-recruitments\/?/i];
        function isStandaloneUrl(url) {
            if (!url) return false;
            try {
                var pathname = new URL(url, window.location.origin).pathname;
                return STANDALONE_URL_PATTERNS.some(function (rx) { return rx.test(pathname); });
            } catch (_) {
                return STANDALONE_URL_PATTERNS.some(function (rx) { return rx.test(url); });
            }
        }

        function shouldFallbackToFullNav(text) {
            if (!text) return false;
            return text.indexOf('id="ohMainContent"') === -1 && text.indexOf("id='ohMainContent'") === -1;
        }

        function fullNavigateFromEvent(evt) {
            var trigger = evt && evt.detail && evt.detail.elt;
            var dest =
                (evt.detail && evt.detail.pathInfo && evt.detail.pathInfo.requestPath) ||
                (trigger && trigger.getAttribute && trigger.getAttribute("href")) ||
                "/";
            window.location.href = dest;
        }

        function navigateTo(link) {
            var href = link.getAttribute("href") || link.getAttribute("hx-get") || "/";
            if (isStandaloneUrl(href)) { window.location.href = href; return; }
            if (!document.getElementById("ohMainContent") || !window.htmx) { window.location.href = href; return; }
            window.history.pushState({}, "", href);
            htmx.ajax("GET", href, {
                source: link,
                target: "#ohMainContent",
                select: "#ohMainContent > *",
                swap: "innerHTML show:window:top",
                headers: { "HX-Sidebar-Nav": "true" },
            });
        }

        function isPlainLeftClick(e) {
            return (!e.button || e.button === 0) && !(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey);
        }

        // ── Clicks ───────────────────────────────────────────────────────────

        // Submenu links (capture phase so htmx's own boost never double-fires).
        panelEl.addEventListener("click", function (e) {
            var link = e.target.closest("a[href], a[hx-get]");
            if (!link || !isPlainLeftClick(e)) return;
            e.preventDefault();
            e.stopPropagation();
            subLinks.forEach(function (l) { l.classList.remove("oh-sidebar-active-link"); });
            link.classList.add("oh-sidebar-active-link");
            var list = link.closest(".sb-section");
            if (list) setActiveMenu(list.dataset.menu);
            navigateTo(link);
            if (!locked) setPanelHidden(true);
        }, true);

        sidebarEl.querySelector("nav").addEventListener("click", function (e) {
            var dashboard = e.target.closest("a.sb-top-link");
            if (dashboard) {
                if (!isPlainLeftClick(e)) return;
                e.preventDefault();
                e.stopPropagation();
                setActiveMenu("Dashboard");
                render();
                navigateTo(dashboard);
                return;
            }
            var button = e.target.closest("button.sb-rail-btn");
            if (!button) return;
            var menu = button.dataset.menu;
            var sameOpen = menu === activeMenu && sidebarEl.classList.contains("sb-panel-open");
            setActiveMenu(menu);
            if (sameOpen) {
                setPanelHidden(true);
            } else {
                panelHidden = false;
                store("sidebarPanelHidden", "false");
                render();
            }
        });

        if (pinBtn) {
            pinBtn.addEventListener("click", function () {
                locked = !locked;
                store("sidebarPinned", locked ? "true" : "false");
                panelHidden = false;
                render();
            });
        }

        // Unlocked: the floating panel goes away when the pointer leaves the sidebar.
        sidebarEl.addEventListener("mouseleave", function () {
            if (locked) return;
            clearTimeout(leaveTimer);
            leaveTimer = setTimeout(function () { setPanelHidden(true); }, 250);
        });
        sidebarEl.addEventListener("mouseenter", function () { clearTimeout(leaveTimer); });

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && (!locked || window.matchMedia("(max-width: 767px)").matches) &&
                sidebarEl.classList.contains("sb-panel-open")) {
                setPanelHidden(true);
            }
        });

        // ── Initial state (runs before first paint of the page body) ─────────

        locked = recall("sidebarPinned") !== "false";
        panelHidden = !locked || recall("sidebarPanelHidden") === "true";
        var remembered = recall("activeSidebarMenu");
        if (remembered && (remembered === "Dashboard" || sectionFor(remembered))) activeMenu = remembered;
        syncToUrl();

        document.addEventListener("htmx:pushUrl", syncToUrl);
        document.addEventListener("htmx:afterSettle", syncToUrl);
        window.addEventListener("popstate", syncToUrl);

        // ── HTMX lifecycle hooks for sidebar-triggered requests ──────────────

        document.addEventListener("htmx:beforeRequest", function (evt) {
            try {
                var trigger = evt && evt.detail && evt.detail.elt;
                if (!(trigger && sidebarEl.contains(trigger))) return;
                var requestPath =
                    (evt.detail.pathInfo && evt.detail.pathInfo.requestPath) ||
                    trigger.getAttribute("href") ||
                    trigger.getAttribute("hx-get");
                if (isStandaloneUrl(requestPath)) {
                    if (evt.detail) evt.detail.shouldSwap = false;
                    evt.preventDefault();
                    if (evt.detail && evt.detail.xhr && typeof evt.detail.xhr.abort === "function") {
                        try { evt.detail.xhr.abort(); } catch (_) {}
                    }
                    window.location.href = requestPath;
                }
            } catch (_) {}
        });

        document.addEventListener("htmx:afterSettle", function (evt) {
            var info = evt && evt.detail;
            if (!info || info._crumbsUpdated) return;
            var etc = info.etc;
            if (!etc || !etc.headers || etc.headers["HX-Sidebar-Nav"] !== "true") return;
            info._crumbsUpdated = true;
            var xhr = info.xhr;
            if (!xhr || !xhr.responseText) return;
            try {
                var doc = new DOMParser().parseFromString(xhr.responseText, "text/html");
                var newCrumbs = doc.getElementById("breadcrumbs-container");
                var currentCrumbs = document.getElementById("breadcrumbs-container");
                if (newCrumbs && currentCrumbs) currentCrumbs.innerHTML = newCrumbs.innerHTML;
            } catch (_) {}
        });

        document.addEventListener("htmx:beforeSwap", function (evt) {
            try {
                var trigger = evt && evt.detail && evt.detail.elt;
                if (!(trigger && sidebarEl.contains(trigger))) return;
                var xhr = evt.detail.xhr;
                if (!xhr || xhr.status < 200 || xhr.status >= 400) return;
                if (!shouldFallbackToFullNav(xhr.responseText)) return;
                if (evt.detail) evt.detail.shouldSwap = false;
                evt.preventDefault();
                fullNavigateFromEvent(evt);
            } catch (_) {}
        });

        function sidebarNavError(evt) {
            try {
                var trigger = evt && evt.detail && evt.detail.elt;
                if (!(trigger && sidebarEl.contains(trigger))) return;
                fullNavigateFromEvent(evt);
            } catch (_) {}
        }
        document.addEventListener("htmx:responseError", sidebarNavError);
        document.addEventListener("htmx:sendError", sidebarNavError);
        document.addEventListener("htmx:timeout", sidebarNavError);
        document.addEventListener("htmx:targetError", sidebarNavError);

        /*
         * Browser back/forward: drop htmx's own popstate handling and reload -
         * its history cache is stale for programmatic htmx.ajax navigation.
         */
        window.onpopstate = null;
        window.addEventListener("popstate", function () { window.location.reload(); });
    })();

    function isChartEmpty(chart) {
        return chart.data.datasets.every(dataset => {
            if (Array.isArray(dataset.data)) {
                return dataset.data.every(value => !value || value === 0);
            } else if (typeof dataset.data === 'object') {
                return Object.values(dataset.data).every(value => !value || value === 0);
            }
            return true;
        });
    }

    function showEmptyState(chart, message = "No records available at the moment") {
        const $canvas = $(chart.canvas);
        const chartId = $canvas.attr("id");

        // Hide canvas wrapper
        $canvas.closest(".relative").hide();

        if ($("#no-data-" + chartId).length === 0) {
            const emptyHTML = `
      <div id="no-data-${chartId}" class="h-[350px] flex items-center justify-center">
        <div class="flex flex-col items-center justify-center">
          <img src="/static/horilla_theme/assets/img/no-records.svg" alt="" width="300" class="mb-4">
          <p class="text-[#666] mb-5">${message}</p>
        </div>
      </div>
    `;
            $canvas.closest(".relative").after(emptyHTML);
        } else {
            $("#no-data-" + chartId).show();
        }
    }

    function hideEmptyState(chart) {
        const $canvas = $(chart.canvas);
        const chartId = $canvas.attr("id");

        // Show canvas wrapper
        $canvas.closest(".relative").show();
        $("#no-data-" + chartId).hide();
    }

    function emptyChart(chart) {
        if (!chart) return;

        if (isChartEmpty(chart)) {
            showEmptyState(chart);
        } else {
            hideEmptyState(chart);
        }
    }
</script>
