{% comment %}Shared look of the sign-in pages (login, forgot password, reset password). Needs `theme_obj`.{% endcomment %}
        <style>
            :root {
                --al-accent: {{ theme_obj.primary_600|default:"#0b82f0" }};
                --al-accent-dark: {{ theme_obj.primary_800|default:"#0966c2" }};
            }
            html, body { height: 100%; margin: 0; }
            body.al-body {
                position: relative;
                min-height: 100vh;
                overflow-x: hidden;
                font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
                color: #0f172a;
                background: linear-gradient(180deg, #78bdf6 0%, #a9d5fb 34%, #d6ebfd 62%, #eef6ff 100%);
            }

            /* ---------- Sky: clouds and a network of light ---------- */
            .al-sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
            .al-sky::before {
                content: "";
                position: absolute;
                inset: 0;
                background:
                    radial-gradient(ellipse 60% 45% at 50% 0%, rgba(255, 255, 255, 0.45), transparent 70%),
                    radial-gradient(ellipse 40% 30% at 92% 4%, rgba(70, 150, 235, 0.55), transparent 70%);
            }
            .al-net { position: absolute; inset: 0; width: 100%; height: 100%; }
            .al-layer {
                position: absolute;
                left: -6%;
                bottom: 0;
                width: 112%;
                height: 100%;
                will-change: transform;
            }
            .al-layer--wisp { opacity: .75; animation: al-drift 150s ease-in-out infinite alternate; }
            .al-layer--far  { opacity: .9;  animation: al-drift 120s ease-in-out infinite alternate-reverse; }
            .al-layer--mid  { animation: al-drift 90s ease-in-out infinite alternate; }
            .al-layer--near { animation: al-drift 65s ease-in-out infinite alternate-reverse; }
            @keyframes al-drift { from { transform: translateX(-1.5%); } to { transform: translateX(1.5%); } }
            @media (prefers-reduced-motion: reduce) { .al-layer { animation: none; } }

            /* ---------- Card ---------- */
            .al-main {
                position: relative;
                z-index: 1;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem 1rem;
            }
            .al-card {
                width: min(24.5rem, 100%);
                padding: 2.25rem 2.25rem 2rem;
                border-radius: 1.75rem;
                background: linear-gradient(135deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.52));
                border: 1px solid rgba(255, 255, 255, 0.75);
                box-shadow: 0 24px 70px -20px rgba(40, 110, 200, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.8);
                -webkit-backdrop-filter: blur(18px) saturate(1.25);
                backdrop-filter: blur(18px) saturate(1.25);
                text-align: center;
            }
            .al-logo { display: block; width: 9.5rem; height: auto; margin: 0 auto 0.75rem; }
            .al-rule { width: 2.5rem; height: 3px; margin: 0 auto 1.5rem; border-radius: 9999px; background: var(--al-accent); }
            .al-title { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.01em; color: #0b1220; }
            .al-sub { margin: 0.4rem 0 1.5rem; font-size: 0.9375rem; color: #6b7a90; }

            .al-form { text-align: left; }
            .al-field { position: relative; margin-bottom: 0.875rem; }
            .al-field > svg.al-ico { position: absolute; left: 0.875rem; top: 50%; width: 1.05rem; height: 1.05rem; transform: translateY(-50%); color: #8a98ad; pointer-events: none; }
            .al-input {
                width: 100%;
                height: 2.875rem;
                padding: 0 2.75rem 0 2.75rem;
                border: 1px solid color-mix(in srgb, var(--al-accent) 55%, #ffffff);
                border-radius: 0.75rem;
                background: rgba(255, 255, 255, 0.55);
                font-size: 0.9375rem;
                color: #0f172a;
                outline: none;
                transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            }
            .al-input::placeholder { color: #8a98ad; }
            .al-input:focus { border-color: var(--al-accent); background: rgba(255, 255, 255, 0.85); box-shadow: 0 0 0 3px color-mix(in srgb, var(--al-accent) 22%, transparent); }
            .al-eye { position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; width: 2rem; height: 2rem; border: 0; background: transparent; color: #8a98ad; cursor: pointer; border-radius: 0.5rem; font-size: 1.1rem; }
            .al-eye:hover { color: #475569; background: rgba(15, 23, 42, 0.05); }
            .al-row { display: flex; justify-content: flex-end; margin: 0.25rem 0 1.25rem; }
            .al-link { font-size: 0.8125rem; font-weight: 500; color: var(--al-accent); text-decoration: none; }
            .al-link:hover { text-decoration: underline; }
            .al-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 2.875rem;
                border: 0;
                border-radius: 0.5rem;
                background: var(--al-accent);
                color: #ffffff;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 0.2s ease, transform 0.05s ease, box-shadow 0.2s ease;
                box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--al-accent) 70%, transparent);
            }
            .al-btn:hover { background: var(--al-accent-dark); }
            .al-btn:active { transform: translateY(1px); }
            .al-btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--al-accent) 40%, transparent); outline-offset: 2px; }
            .al-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
            .al-btn:disabled:hover { background: var(--al-accent); }
            .al-btn:disabled:active { transform: none; }

            .al-error { margin: 0.375rem 0 0; padding: 0; list-style: none; font-size: 0.8125rem; color: #b91c1c; }
            .al-error li { margin: 0.125rem 0; }
            .al-help { margin: 1.1rem 0 0; font-size: 0.8125rem; line-height: 1.5; color: #6b7a90; text-align: center; }
            .al-back { display: inline-flex; align-items: center; gap: 0.35rem; margin-top: 1rem; font-size: 0.875rem; font-weight: 500; color: var(--al-accent); text-decoration: none; }
            .al-back:hover { text-decoration: underline; }
            .al-center { text-align: center; }
            .al-badge { display: flex; align-items: center; justify-content: center; width: 3.5rem; height: 3.5rem; margin: 0 auto 1rem; border-radius: 9999px; background: color-mix(in srgb, var(--al-accent) 14%, #ffffff); color: var(--al-accent); }
            .al-btn--link { text-decoration: none; }
            .al-label { display: block; margin: 0 0 0.375rem; font-size: 0.8125rem; font-weight: 600; color: #334155; }

            .al-setup { display: flex; gap: 0.5rem; margin-top: 1rem; }
            .al-setup a { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.375rem; padding: 0.7rem 0.5rem; border-radius: 0.5rem; font-size: 0.8125rem; font-weight: 600; text-decoration: none; cursor: pointer; }

            @media (max-width: 480px) {
                .al-card { padding: 1.75rem 1.25rem 1.5rem; border-radius: 1.5rem; }
                .al-title { font-size: 1.5rem; }
            }
            @media (prefers-reduced-motion: reduce) {
                .al-input, .al-btn { transition: none; }
            }
        </style>
