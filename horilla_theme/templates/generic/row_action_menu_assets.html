<style>
    .row-action-menu { display: inline-block; position: relative; }
    .row-action-btn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 2rem; height: 2rem; border: 0; border-radius: 0.5rem;
        background: #f3f4f6; color: #374151; cursor: pointer;
        transition: background-color 0.15s ease;
    }
    .row-action-btn:hover, .row-action-menu.is-open .row-action-btn { background: #e5e7eb; }
    .row-action-list {
        display: none; position: fixed; z-index: 10070; min-width: 12rem;
        padding: 0.375rem; text-align: left; background: #ffffff;
        border: 1px solid #e5e7eb; border-radius: 0.625rem;
        box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.14), 0 2px 8px -2px rgba(15, 23, 42, 0.06);
    }
    .row-action-list .row-action-item {
        display: flex; align-items: center; gap: 0.625rem; width: 100%;
        padding: 0.4375rem 0.625rem; border-radius: 0.5rem;
        font-size: 0.8125rem; line-height: 1.25rem; color: #374151;
        text-decoration: none; cursor: pointer;
    }
    .row-action-list .row-action-item ion-icon { font-size: 1rem; flex-shrink: 0; color: #6b7280; }
    .row-action-list .row-action-item:hover { background: #f3f4f6; color: #111827; }
    .row-action-list .row-action-item.is-danger, .row-action-list .row-action-item.is-danger ion-icon { color: #dc2626; }
    .row-action-list .row-action-item.is-danger:hover { background: #fef2f2; }
    .row-action-sep { height: 1px; margin: 0.25rem 0.375rem; background: #fca5a5; opacity: 0.6; }
    body.dark .row-action-btn { background: rgba(255, 255, 255, 0.08); color: #e5e7eb; }
    body.dark .row-action-list { background: #1f2937; border-color: #374151; }
    body.dark .row-action-list .row-action-item { color: #d1d5db; }
    body.dark .row-action-list .row-action-item:hover { background: rgba(255, 255, 255, 0.07); color: #ffffff; }
</style>
<script>
    (function () {
        if (!window.jQuery) return;
        var $ = window.jQuery, current = null, timer = null;
        // While open, the list is moved to <body>: inside the table the sticky
        // cells of later rows would paint over it.
        function listOf(menu) { return menu._list || (menu._list = menu.querySelector(".row-action-list")); }
        function place(menu) {
            var btn = menu.querySelector(".row-action-btn"), list = listOf(menu);
            var r = btn.getBoundingClientRect();
            list.style.display = "block";
            var h = list.offsetHeight, w = list.offsetWidth;
            var top = r.bottom;
            if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h);
            var left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8));
            list.style.top = top + "px";
            list.style.left = left + "px";
        }
        function open(menu) {
            clearTimeout(timer);
            if (current && current !== menu) close(current);
            var list = listOf(menu);
            list._menu = menu;
            if (list.parentNode !== document.body) document.body.appendChild(list);
            current = menu;
            menu.classList.add("is-open");
            place(menu);
        }
        function close(menu) {
            var list = listOf(menu);
            menu.classList.remove("is-open");
            list.style.display = "";
            if (list.parentNode === document.body) menu.appendChild(list);
            if (current === menu) current = null;
        }
        function later(menu) {
            clearTimeout(timer);
            timer = setTimeout(function () { close(menu); }, 120);
        }
        $(document)
            .off(".rowActionMenu")
            .on("mouseenter.rowActionMenu", ".row-action-menu", function () { open(this); })
            .on("mouseleave.rowActionMenu", ".row-action-menu", function () { later(this); })
            .on("mouseenter.rowActionMenu", "body > .row-action-list", function () { clearTimeout(timer); })
            .on("mouseleave.rowActionMenu", "body > .row-action-list", function () { if (this._menu) later(this._menu); })
            .on("click.rowActionMenu", ".row-action-btn", function (e) {
                e.preventDefault();
                open(this.closest(".row-action-menu"));
            })
            ;
        // Capture phase: some actions stop the click from bubbling, which would leave the menu open.
        if (window._rowActionMenuClick) document.removeEventListener("click", window._rowActionMenuClick, true);
        window._rowActionMenuClick = function (e) {
            var item = e.target.closest && e.target.closest(".row-action-item");
            var list = item && item.closest(".row-action-list"), menu = list && list._menu;
            if (menu) setTimeout(function () { close(menu); }, 0);
        };
        document.addEventListener("click", window._rowActionMenuClick, true);
        document.addEventListener("scroll", function (e) {
            if (current && !(e.target.closest && e.target.closest(".row-action-list"))) close(current);
        }, true);
    })();
</script>
