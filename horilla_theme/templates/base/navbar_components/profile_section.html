{% load static i18n %}
<button>
    <div class="flex gap-3">
        <div class="relative flex items-center cursor-pointer w-max">
            <img
                src="{{request.user.employee_get.get_avatar}}"
                alt="user"
                class="w-9 h-9 rounded-lg object-cover"
                loading="lazy"
            >
            <span
                class="
                    absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white
                    {% if user.employee_get.check_online %} bg-[#1dd75b] {% else %} bg-[red] {% endif %}
                "
            ></span>
        </div>
        <div class="hidden md:block">
            <div class="flex flex-col justify-center items-start h-full">
                <h5 class="font-semibold text-sm leading-4">{{ user.employee_get.get_full_name|title }}</h5>
                <p class="text-xs text-dark-200 leading-4">
                    {% if user.employee_get.check_online %}
                        {% trans "Online" %}
                    {% else %}
                        {% trans "Offline" %}
                    {% endif %}
                </p>
            </div>
        </div>
        <div class="hidden md:block pt-2">
            <img
                src="/static/horilla_theme/assets/img/icons/downarrow.svg"
                alt=""
                class="downarrow"
            >
        </div>
    </div>
</button>

<div class="dropdown-content absolute z-10 bg-white rounded-lg [box-shadow:0px_0px_20px_0px_rgb(0_0_0_/_8%)] min-w-[170px] py-2 px-4 right-0">
    <ul>
        {% if request.session.selected_company == "all" or request.user.employee_get.employee_work_info.company_id.id == request.session.selected_company|default:"-1"|add:"0" %}
            <li>
                <button class="py-1.5 hover:text-primary-600 transition duration-300 text-sm gap-4 items-center flex w-full">
                    <a
                        class="text-[13px]"
                        href="{% url 'employee-profile' %}"
                        hx-get="{% url 'employee-profile' %}"
                        hx-target="#ohMainContent"
                        hx-select="#ohMainContent > *"
                        hx-swap="innerHTML show:window:top"
                        hx-push-url="true"
                    >{% trans "My Profile" %}</a>
                </button>
            </li>
        {% endif %}
            <li>
                <button class="py-1.5 hover:text-primary-600 transition duration-300 text-sm gap-4 items-center flex w-full">
                    <a
                        class="text-[13px]"
                        href="{% url 'change-username' %}"
                        hx-get="{% url 'change-username' %}"
                        hx-target="#ohMainContent"
                        hx-select="#ohMainContent > *"
                        hx-swap="innerHTML show:window:top"
                        hx-push-url="true"
                    >{% trans "Change Username" %}</a>
                </button>
            </li>
            <li>
                <button class="py-1.5 hover:text-primary-600 transition duration-300 text-sm gap-4 items-center flex w-full">
                    <a
                        class="text-[13px]"
                        href="{% url 'change-password' %}"
                        hx-get="{% url 'change-password' %}"
                        hx-target="#ohMainContent"
                        hx-select="#ohMainContent > *"
                        hx-swap="innerHTML show:window:top"
                        hx-push-url="true"
                    >{% trans "Change Password" %}</a>
                </button>
            </li>

        <hr class="text-[#1c1c1c] my-2">
        <li>
            <form method="post" action="{% url 'logout' %}" hx-boost="false">
                {% csrf_token %}
                <button type="submit" class="py-1.5 hover:text-primary-600 transition duration-300 text-sm gap-4 items-center flex w-full">
                    <span class="text-[13px]"> {% trans "Logout" %} </span>
                </button>
            </form>
        </li>
    </ul>
</div>
