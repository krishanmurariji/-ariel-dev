{% load i18n %}
<style>
    #objectCreateModal:has(#sendLoiForm-{{ candidate.id }}) .oh-modal__dialog {
        max-width: 1040px;
    }
    @media (max-width: 900px) {
        .oh-loi-columns {
            grid-template-columns: 1fr !important;
        }
    }
</style>

<div class="oh-modal__dialog-header">
    <span class="oh-modal__dialog-title" id="sendLoiModalLabel">
        <h5>{% trans "Send Letter of Intent to" %} {{ candidate.name }}</h5>
    </span>
    <button class="oh-modal__close" aria-label="Close"><ion-icon name="close-outline"></ion-icon></button>
</div>

<div class="oh-modal__dialog-body">
    <form onsubmit="$(this).closest('.oh-modal--show').removeClass('oh-modal--show')"
        hx-post='{% url "send-loi" candidate.id %}' hx-swap="none" class="oh-profile-section"
        id="sendLoiForm-{{ candidate.id }}">
        {% csrf_token %}

        <div class="modal-body">
            <div class="oh-loi-columns" style="display:grid;grid-template-columns:1fr 1.1fr;gap:24px;">

                <div>
                    <p style="margin:0 0 8px;font-size:13px;font-weight:600;color:#333;">
                        {% trans "Your message" %}
                    </p>
                    <div style="background:#f8f9fb;border-radius:8px;padding:16px 18px;">
                        <p style="margin:0 0 10px;color:#333;">{% trans "Dear" %} {{ candidate.name }},</p>

                        <textarea id="loiMessageInput-{{ candidate.id }}" name="message" required rows="10"
                            placeholder="{% trans 'Write your message to the candidate here...' %}"
                            class="oh-input oh-input--textarea w-100" style="resize:vertical;"></textarea>
                    </div>
                </div>

                <div>
                    <p style="margin:0 0 8px;font-size:13px;font-weight:600;color:#333;">
                        {% trans "This is exactly what" %} {{ candidate.name }} {% trans "will receive" %}
                    </p>
                    <iframe id="loiPreviewFrame-{{ candidate.id }}" title="{% trans 'Email preview' %}"
                        style="width:100%;height:480px;border:1px solid #e5e7eb;border-radius:8px;background:#e9e9e9;"></iframe>
                </div>

            </div>
        </div>

        <div class="oh-modal__dialog-footer mt-3">
            <button type="button" class="oh-btn oh-btn--secondary oh-modal__close">{% trans "Cancel" %}</button>
            <button type="submit" class="oh-btn oh-btn--secondary oh-btn--shadow">{% trans "Send" %}</button>
        </div>
    </form>
</div>

<script>
    (function () {
        var input = document.getElementById("loiMessageInput-{{ candidate.id }}");
        var frame = document.getElementById("loiPreviewFrame-{{ candidate.id }}");
        var previewUrl = "{% url 'loi-preview' candidate.id %}";
        var csrfToken = document.querySelector(
            '#sendLoiForm-{{ candidate.id }} [name="csrfmiddlewaretoken"]'
        ).value;
        var timer = null;

        function loadPreview() {
            fetch(previewUrl, {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken,
                    "Content-Type": "application/x-www-form-urlencoded",
                },
                body: "message=" + encodeURIComponent(input.value),
            })
                .then(function (resp) { return resp.text(); })
                .then(function (html) { frame.srcdoc = html; });
        }

        input.addEventListener("input", function () {
            clearTimeout(timer);
            timer = setTimeout(loadPreview, 400);
        });

        loadPreview();
    })();
</script>
