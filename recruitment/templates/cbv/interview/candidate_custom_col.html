{% load i18n %}
<div class="iv-person">
    <img class="iv-person__img" src="{{ instance.candidate_id.get_avatar }}" alt="" width="36" height="36">
    <div class="iv-person__text">
        <span class="iv-person__name">{{ instance.candidate_id }}</span>
        <span class="iv-person__sub">{{ instance.candidate_id.job_position_id|default:instance.candidate_id.recruitment_id|default_if_none:"" }}</span>
    </div>
</div>
