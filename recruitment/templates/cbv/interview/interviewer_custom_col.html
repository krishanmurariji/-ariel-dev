{% load i18n %}
<div class="iv-stack" data-cell-index="1">
    {% for employee in instance.employee_id.all|slice:":3" %}
        <img class="iv-stack__img" src="{{ employee.get_avatar }}" alt="" title="{{ employee.get_full_name }}" width="26" height="26">
    {% empty %}
        <span class="iv-muted">-</span>
    {% endfor %}
    {% with total=instance.employee_id.all|length %}
        {% if total > 3 %}<span class="iv-stack__more" title="{{ total }} {% trans 'Interviewers' %}">+{{ total|add:"-3" }}</span>{% endif %}
    {% endwith %}
</div>
