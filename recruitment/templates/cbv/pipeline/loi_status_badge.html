{% load i18n %}
{% with resp=instance.get_latest_loi_response %}
    {% if resp %}
        {% if resp.status == "accepted" %}
            <span style="background:#dcfce7;color:#166534;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;">{% trans "LOI Accepted" %}</span>
        {% elif resp.status == "declined" %}
            <span style="background:#fef2f2;color:#b91c1c;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;">{% trans "LOI Declined" %}</span>
        {% else %}
            <span style="background:#fef9c3;color:#854d0e;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;">{% trans "LOI Sent" %}</span>
        {% endif %}
    {% endif %}
{% endwith %}
