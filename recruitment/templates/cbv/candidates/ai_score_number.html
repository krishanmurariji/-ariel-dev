{% load i18n %}
{% if instance.latest_ai_score is not None %}
  {% if instance.latest_ai_score >= 75 %}
    <span style="color:yellowgreen; font-weight:600;">{{ instance.latest_ai_score }}</span>
  {% elif instance.latest_ai_score >= 50 %}
    <span style="color:orange; font-weight:600;">{{ instance.latest_ai_score }}</span>
  {% else %}
    <span style="color:indianred; font-weight:600;">{{ instance.latest_ai_score }}</span>
  {% endif %}
{% else %}
  <span class="text-muted">-</span>
{% endif %}
