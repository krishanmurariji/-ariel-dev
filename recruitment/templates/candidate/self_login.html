{% load static %}
{% load horillafilters %}
{% get_company as theme_obj %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candidate Portal - {{ white_label_company_name }}</title>
    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="{% if white_label_company.icon %}{{ white_label_company.icon.url }}{% else %}{% static 'favicons/apple-touch-icon.png' %}{% endif %}"
    >
    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="{% if white_label_company.icon %}{{ white_label_company.icon.url }}{% else %}{% static 'favicons/favicon-32x32.png' %}{% endif %}"
    >
    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="{% if white_label_company.icon %}{{ white_label_company.icon.url }}{% else %}{% static 'favicons/favicon-16x16.png' %}{% endif %}"
    >
    <link href="{% static 'horilla_theme/assets/css/tailwind.css' %}" rel="stylesheet">
    <script src='{% static "horilla_theme/assets/js/tailwindcdn.js" %}'></script>
    <link rel="stylesheet" href="{% static 'build/css/style.min.css' %}" />
  </head>
  <body class="bg-[{{theme_obj.primary_50}}] font-[Inter,_sans-serif]">
    <div class="h-screen w-full flex items-center justify-center">
      <div class="bg-[{{theme_obj.primary_200}}] p-[50px] rounded-2xl [box-shadow:0px_0px_25px_#a1a1a1] w-[450px]">
        <img
            src="{% if white_label_company.icon %}{{ white_label_company.icon.url }}{% else %}{% static 'horilla_theme/assets/img/logo.svg' %}{% endif %}"
            alt=""
            class="m-auto mb-4"
            width="80"
        >
        <h1 class="text-2xl font-bold mb-2 text-center">
          Candidate Portal
        </h1>
        <p class="mb-5 text-center text-sm text-color-600">
          Log in with your registered email and phone number to check your application and interview status.
        </p>

        {% if error %}
        <div class="mb-4 rounded-md p-3 text-sm" style="background-color:#fdecea;color:#b3261e;">
          {{ error }}
        </div>
        {% endif %}

        <form action="{% url 'candidate-login' %}" method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="email" class="text-sm text-color-600">Email</label>
            <input
                type="text"
                id="email"
                name="email"
                placeholder="e.g. janedoe@example.com"
                class="text-color-600 w-full border border-dark-50 rounded-md p-3 mt-1 focus-visible:outline-0 placeholder:text-[#00000041] placeholder:font-medium text-xs [transition:.3s] {% if theme_obj %} focus:border-[{{theme_obj.primary_700}}] {% else %} focus:border-primary-600 {% endif %}"
            >
          </div>
          <div class="mb-4">
            <label for="phone" class="text-sm text-color-600">Phone</label>
            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="e.g. 9876543210"
                class="text-color-600 w-full border border-dark-50 rounded-md p-3 mt-1 focus-visible:outline-0 placeholder:text-[#00000041] placeholder:font-medium text-xs [transition:.3s] {% if theme_obj %} focus:border-[{{theme_obj.primary_700}}] {% else %} focus:border-primary-600 {% endif %}"
            >
          </div>
          <button
              type="submit"
              class="p-3 mt-1 {% if theme_obj %} bg-[{{theme_obj.primary_600}}] hover:bg-[{{theme_obj.primary_800}}] {% else %} bg-primary-600 hover:bg-primary-800 {% endif %} w-full flex gap-3 justify-center rounded-md text-[white] [transition:.3s]"
          >
            View My Application Status
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
