# Safe serving of uploaded files (/media/) - for the LIVE nginx site file.
#
# Why this exists: files in /media/ are served straight from disk by nginx, so
# the safety rules in the Django app (which force script-capable files to
# download) never run for them. A user could upload an SVG / XML file and send
# a colleague a link that, once opened, runs the uploader's script as that
# colleague. These rules close that gap at the web server.
#
# How to apply:
#   1. Put the three `map` blocks inside the `http { ... }` block (or in a file
#      under /etc/nginx/conf.d/ - those are included inside `http`).
#   2. In your site's `location /media/ { ... }` block, add the four
#      add_header lines below (keep your existing `alias` and rate-limit lines).
#   3. `sudo nginx -t && sudo systemctl reload nginx`
#   4. Check: open an uploaded .svg link - the browser should DOWNLOAD it
#      instead of showing it; ordinary images and PDFs open as before.
#      curl -I https://YOUR-HOST/media/<some file>.svg   -> look for
#      "Content-Disposition: attachment" and "Content-Security-Policy: ... sandbox"

# ---- 1. inside http { } ------------------------------------------------------
map $uri $media_active_content {
    default 0;
    ~*\.(svg|svgz|xml|xsl|xslt|xht|xhtml|html|htm|shtml|mht|mhtml|rdf|mathml|js|mjs|swf)$ 1;
}
map $media_active_content $media_disposition {
    1 "attachment";
    default "";
}
map $media_active_content $media_csp {
    1 "default-src 'none'; sandbox";
    default "";
}

# ---- 2. inside location /media/ { } -----------------------------------------
