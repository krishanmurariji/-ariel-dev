events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security
    server_tokens off;

    # Only reachable through Caddy (TLS terminates there). Trust its forwarded
    # client IP so X-Real-IP and the media rate limit see real visitors, and
    # tell Django the request was HTTPS (SECURE_PROXY_SSL_HEADER).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    upstream django {
        server web:8000;
    }

    # /media/ is served with no authentication (files are told apart only
    # by an unguessable path - see horilla/models.py's upload_path /
    # sensitive_upload_path), so it's the one location where a scripted
    # client trying to enumerate random-looking paths is a real threat
    # even without any application bug. 30r/m per IP is generous for a
    # real browser loading a page's worth of images/documents (the burst
    # below absorbs that), but makes brute-forcing a UUID-sized path space
    # take millennia instead of days.
    limit_req_zone $binary_remote_addr zone=media_zone:10m rate=30r/m;

    # ---- uploaded files that a browser would RUN if opened from our address ----
    # SVG, XML and web-page style files can carry script. /media/ is served
    # straight from disk (the Django view that normally forces such files to
    # download is bypassed), so nginx has to do it: these types are always sent
    # as a download, and if one is ever opened directly it is sandboxed with
    # scripts switched off. Everything else is served as before.
    # (Copy these three maps and the headers in "location /media/" into the
    # live server's site file too - see docker/nginx-media-hardening.conf.)
    map $uri $media_active_content {
        default 0;
        ~*\.(svg|svgz|xml|xsl|xslt|xht|xhtml|html|htm|shtml|mht|mhtml|rdf|mathml|js|mjs|swf)$ 1;
    }
    map $media_active_content $media_disposition {
        1 "attachment";
        default "";
    }
    map $media_active_content $media_csp {
        1 "default-src 'none'; sandbox";
        default "";
    }

    server {
        listen 80;
        client_max_body_size 50M;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location /static/ {
            alias /static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location /media/ {
            alias /media/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # an empty value means "do not send the header" (ordinary files)
            add_header Content-Disposition $media_disposition always;
            add_header Content-Security-Policy $media_csp always;
            limit_req zone=media_zone burst=20 nodelay;
            limit_req_status 429;
        }

        location /ws/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # WebSocket connections are long-lived and otherwise idle between
            # messages - the default proxy_read_timeout (120s below) would
            # silently kill one the moment nothing is sent for that long,
            # which is exactly what a chat socket does most of the time.
            proxy_read_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }
    }
}
