name: Diagnose Production (read-only)

on:
  workflow_dispatch: {}   # Run from: repo -> Actions tab -> this workflow -> "Run workflow"

jobs:
  diagnose:
    # Same self-hosted runner the deploy workflow uses - this server has no
    # public SSH access (only 80/443 are forwarded), so this is the only
    # channel available to inspect it. Read-only: nothing here restarts,
    # stops, or modifies the app, the database, or any files.
    #
    # This account only has passwordless sudo for the exact
    # `systemctl {start,stop,status} arielhr` commands deploy.sh already
    # uses (confirmed working) - not a blanket sudo grant. Steps that need
    # anything beyond that (journalctl) are best-effort: they're allowed
    # to fail without stopping the rest of the diagnostics from running.
    runs-on: self-hosted

    steps:
      - name: Service status (uses the same sudo rule deploy.sh already has)
        run: sudo systemctl status arielhr --no-pager
        shell: bash
        continue-on-error: true

      - name: Recent application log - try without sudo first
        run: journalctl -u arielhr -n 200 --no-pager
        shell: bash
        continue-on-error: true

      - name: Recent application log - try with sudo (likely needs a NOPASSWD rule added - see note below)
        run: sudo -n journalctl -u arielhr -n 200 --no-pager
        shell: bash
        continue-on-error: true

      - name: Database connections vs. configured limit (via the app's own DB access, no sudo needed)
        working-directory: /opt/arielhr
        run: |
          source venv/bin/activate
          python manage.py shell -c "
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute('SELECT count(*) FROM pg_stat_activity;')
              print('Total connections:', cursor.fetchone()[0])
              cursor.execute('SHOW max_connections;')
              print('Max connections:', cursor.fetchone()[0])
              cursor.execute(\"SELECT state, count(*) FROM pg_stat_activity GROUP BY state ORDER BY count(*) DESC;\")
              print('Breakdown by state:')
              for row in cursor.fetchall():
                  print(' ', row)
          "
        shell: bash
        continue-on-error: true

      - name: Disk and memory snapshot (no sudo needed)
        run: |
          df -h
          free -h
        shell: bash
        continue-on-error: true

      - name: Gunicorn process list (no sudo needed)
        run: ps aux | grep gunicorn | grep -v grep
        shell: bash
        continue-on-error: true
