# Verify Docker build and runtime on the runner.
# Catches: Dockerfile/build failures, migration errors, collectstatic issues,
# gunicorn startup failures, and broken health endpoint.

name: Docker CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  COMPOSE_FILE: docker-compose.yml

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        run: |
          set -e
          docker compose -f "$COMPOSE_FILE" build web

      - name: Ensure local_settings exists (gitignored; Django settings import requires it)
        run: |
          if [ ! -f horilla/settings/local_settings.py ]; then
            printf '%s\n' '# Ephemeral for CI — allows settings import *' > horilla/settings/local_settings.py
          fi

      - name: Start db and redis
        run: |
          docker compose -f "$COMPOSE_FILE" up -d db redis
          # Wait for Postgres to accept connections
          for i in $(seq 1 60); do
            if docker compose -f "$COMPOSE_FILE" exec -T db pg_isready -U horilla_user -d horilla_db 2>/dev/null; then
              echo "Postgres is ready"
              break
            fi
            sleep 2
            if [ "$i" -eq 60 ]; then
              echo "Postgres did not become ready in time"
              docker compose -f "$COMPOSE_FILE" logs db
              exit 1
            fi
          done

      - name: Run migrations and Django checks (no long-running server)
        run: |
          set -e
          # Bypass entrypoint to avoid makemigrations mutating the workspace on mounted volume.
          # Still validates migrate + collectstatic + Django system checks against real Postgres.
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps \
            --entrypoint "" \
            web sh -c "
              set -e
              python manage.py migrate --noinput
              python manage.py collectstatic --noinput
              python manage.py check
            "

      - name: Run Django test suite
        run: |
          set -e
          docker compose -f "$COMPOSE_FILE" run --rm --no-deps \
            --entrypoint "" \
            web sh -c "python manage.py test --noinput"

      - name: Start web (gunicorn) and wait for health
        run: |
          set -e
          docker compose -f "$COMPOSE_FILE" up -d web

          echo "Waiting for http://localhost:8000/health/ ..."
          for i in $(seq 1 90); do
            if curl -sf --max-time 5 http://localhost:8000/health/ | grep -q '"status"'; then
              echo "Health check OK"
              curl -s http://localhost:8000/health/
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed — web logs:"
          docker compose -f "$COMPOSE_FILE" logs --tail=80 web
          exit 1

      - name: Optional — production profile (nginx in front of web)
        continue-on-error: true
        run: |
          docker compose -f "$COMPOSE_FILE" --profile production up -d nginx
          sleep 5
          curl -sf --max-time 10 http://localhost:80/health/ || echo "Nginx health check skipped or failed (web :8000 already validated)"

      - name: Tear down
        if: always()
        run: |
          docker compose -f "$COMPOSE_FILE" --profile production down -v --remove-orphans || true
          docker compose -f "$COMPOSE_FILE" down -v --remove-orphans || true

  static-analysis:
    # Runs directly on the runner against SQLite (no Docker/Postgres) so it
    # finishes in a couple of minutes and gives fast feedback in parallel
    # with docker-smoke above. Catches a different class of issue than the
    # behavioral test suite does - see the exec()-based RCE this caught
    # retroactively in recruitment/cbv/candidates.py (fixed 2026-09-10).
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit coverage pip-audit

      - name: Ensure local_settings exists (gitignored; Django settings import requires it)
        run: |
          if [ ! -f horilla/settings/local_settings.py ]; then
            printf '%s\n' '# Ephemeral for CI — allows settings import *' > horilla/settings/local_settings.py
          fi

      - name: Bandit — recruitment & onboarding (blocking)
        # Scoped to the two modules covered by the 2026-09-10 QA audit -
        # fails the build on medium+ severity findings, so the same class
        # of bug (e.g. the exec()-based RCE found and removed that day)
        # can't be reintroduced here unnoticed.
        run: bandit -r recruitment onboarding -ll

      - name: Bandit — full repo (informational)
        # Broader legacy code hasn't been through the same audit yet, so
        # this reports findings without failing the build - a starting
        # point for extending the audit to other modules.
        continue-on-error: true
        run: bandit -r . -x ./venv,./.venv,./node_modules,./static,./staticfiles -ll

      - name: pip-audit — dependency vulnerabilities (informational)
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: Coverage — recruitment & onboarding test suite
        run: |
          coverage run --source=recruitment,onboarding manage.py test recruitment onboarding --noinput
          coverage report -m
          coverage html -d coverage_html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage_html/
          retention-days: 14
