name: Deploy to Ubuntu Server (arielhr)

on:
  workflow_dispatch: {}   # ONLY manual trigger — no auto-deploy on push/commit
                          # Run from: repo → Actions tab → this workflow → "Run workflow"

jobs:
  deploy-ubuntu-server:
    # This job runs on the runner you installed ON THE SERVER ITSELF,
    # not on GitHub's cloud runners — required since the server has no
    # public SSH access (only 80/443 are forwarded).
    runs-on: self-hosted
    environment: production   # optional: set up required reviewers under
                               # Settings > Environments > production

    steps:
      - name: Checkout (for reference only — deploy.sh does the real pull)
        uses: actions/checkout@v4

      - name: Run deploy script
        run: bash scripts/deploy.sh
        shell: bash
        env:
          DB_ENGINE: ${{ secrets.DB_ENGINE }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DJANGO_SUPERUSER_USERNAME: ${{ secrets.DJANGO_SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_EMAIL: ${{ secrets.DJANGO_SUPERUSER_EMAIL }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}

